# Development defaults are used when no .env file exists, so `docker compose up --build`
# works with zero setup. For anything real, copy .env.example to .env and change them.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: callzo
      POSTGRES_USER: callzo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callzo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callzo -d callzo"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://callzo:${POSTGRES_PASSWORD:-callzo}@db:5432/callzo
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-callzo_test_secret_change_me}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-local-dev-token-change-me}
      # 300 so that the simulator's cap_burst scenario (about 400 minutes for one account)
      # visibly crosses the cap. Use something like 1000+ outside the demo.
      MONTHLY_MINUTES_CAP: ${MONTHLY_MINUTES_CAP:-300}
      RETRY_INTERVAL_SECONDS: ${RETRY_INTERVAL_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  simulator:
    image: meetrj/callzo-webhook-simulator
    platform: linux/arm64
    depends_on:
      api:
        condition: service_healthy
    command: ["--url", "http://api:8000/webhooks/calls", "--scenario", "all"]

volumes:
  postgres_data:
