server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's internal DNS. Resolving at request time (not at startup) means nginx
  # still starts even if the mock API container is a few seconds late.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $mock_api mock-api:8001;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$mock_api;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
